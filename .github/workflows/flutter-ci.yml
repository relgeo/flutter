name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.41.9

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: flutter

      - name: Check out MCP dependency
        uses: actions/checkout@v4
        with:
          repository: relgeo/mcp
          ref: b4561c08f7b41fd5630c76138a26ce6717ae9b33
          path: mcp
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

  desktop-build:
    name: Test and build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macOS
            runner: macos-latest
            command: macos
          - target: Linux
            runner: ubuntu-latest
            command: linux
          - target: Windows
            runner: windows-latest
            command: windows
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: flutter

      - name: Check out MCP dependency
        uses: actions/checkout@v4
        with:
          repository: relgeo/mcp
          ref: b4561c08f7b41fd5630c76138a26ce6717ae9b33
          path: mcp
          persist-credentials: false

      - name: Install Linux desktop build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Test on native runner (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: flutter test --no-pub --reporter compact

      - name: Test on native runner (Linux and Windows)
        if: ${{ runner.os != 'macOS' }}
        run: flutter test --no-pub --reporter compact --exclude-tags golden

      - name: Build desktop application
        run: flutter build ${{ matrix.command }} --release --no-pub

  notify-workspace:
    name: Notify workspace after validated main CI
    needs:
      - quality
      - desktop-build
    if: >-
      ${{
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main' &&
        needs.quality.result == 'success' &&
        needs.desktop-build.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch validated submodule revision to workspace
        uses: actions/github-script@v7
        env:
          WORKSPACE_DISPATCH_TOKEN: ${{ secrets.WORKSPACE_DISPATCH_TOKEN }}
        with:
          github-token: ${{ secrets.WORKSPACE_DISPATCH_TOKEN || github.token }}
          script: |
            if (!process.env.WORKSPACE_DISPATCH_TOKEN) {
              core.setFailed(
                'Missing WORKSPACE_DISPATCH_TOKEN. Configure a fine-grained token or GitHub App token with Contents: write on relgeo/workspace.'
              );
              return;
            }

            await github.rest.repos.createDispatchEvent({
              owner: 'relgeo',
              repo: 'workspace',
              event_type: 'submodule_ci_succeeded',
              client_payload: {
                submodule: 'flutter',
                repository: 'relgeo/flutter',
                path: 'flutter',
                sha: context.sha,
                run_id: String(context.runId),
                run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                workflow: '.github/workflows/flutter-ci.yml',
                branch: context.ref
              }
            });

            core.info(`Dispatched ${context.sha} to relgeo/workspace.`);
