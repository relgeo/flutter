name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.41.9
  MCP_REVISION: b4561c08f7b41fd5630c76138a26ce6717ae9b33

jobs:
  validate:
    name: Validate release tag and source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out tagged Flutter source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          path: flutter

      - name: Require release tag to point at main
        working-directory: flutter
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "Release tags must point to a commit already on main." >&2
            exit 1
          }

      - name: Match tag to application version
        id: version
        working-directory: flutter
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#desktop-v}"
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Invalid desktop release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          APP_VERSION="$(sed -n 's/^version: *\([0-9][^+ #]*\).*/\1/p' pubspec.yaml | head -n 1)"
          RELEASE_VERSION="${TAG_VERSION%%-rc.*}"
          if [[ -z "$APP_VERSION" || "$RELEASE_VERSION" != "$APP_VERSION" ]]; then
            echo "Tag version $RELEASE_VERSION does not match pubspec.yaml version $APP_VERSION." >&2
            exit 1
          fi

          if [[ "$TAG_VERSION" == *-rc.* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  quality:
    name: Analyze and test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out Flutter source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: flutter

      - name: Check out pinned MCP dependency
        uses: actions/checkout@v4
        with:
          repository: relgeo/mcp
          ref: ${{ env.MCP_REVISION }}
          path: mcp
          persist-credentials: false

      - name: Install Linux test and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install locked dependencies
        working-directory: flutter
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        working-directory: flutter
        run: flutter analyze --no-pub

      - name: Test
        working-directory: flutter
        run: flutter test --no-pub --reporter compact --exclude-tags golden

  build:
    name: Build ${{ matrix.target }}
    needs:
      - validate
      - quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            runner: macos-latest
          - target: linux-x64
            runner: ubuntu-latest
          - target: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out Flutter source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: flutter

      - name: Check out pinned MCP dependency
        uses: actions/checkout@v4
        with:
          repository: relgeo/mcp
          ref: ${{ env.MCP_REVISION }}
          path: mcp
          persist-credentials: false

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install locked dependencies
        working-directory: flutter
        run: flutter pub get --enforce-lockfile

      - name: Test macOS runner
        if: runner.os == 'macOS'
        working-directory: flutter
        run: flutter test --no-pub --reporter compact

      - name: Test Linux and Windows runner
        if: runner.os != 'macOS'
        working-directory: flutter
        run: flutter test --no-pub --reporter compact --exclude-tags golden

      - name: Build and archive macOS app
        if: runner.os == 'macOS'
        working-directory: flutter
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          flutter build macos --release --no-pub \
            --build-name="$RELEASE_VERSION" \
            --build-number="$GITHUB_RUN_NUMBER"
          APP="build/macos/Build/Products/Release/RelGeo.app"
          EXECUTABLE="$APP/Contents/MacOS/RelGeo"
          test -d "$APP"
          test -x "$EXECUTABLE"
          ARCHS="$(lipo -archs "$EXECUTABLE")"
          if [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]; then
            ARCH=universal
          elif [[ "$ARCHS" == *arm64* ]]; then
            ARCH=arm64
          elif [[ "$ARCHS" == *x86_64* ]]; then
            ARCH=x64
          else
            echo "Unexpected macOS executable architectures: $ARCHS" >&2
            exit 1
          fi
          mkdir -p ../release-assets
          ASSET="../release-assets/RelGeo-macos-${ARCH}-v${RELEASE_VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ASSET"
          printf 'target=macos\narchitecture=%s\nflutter=%s\ndart=%s\n' \
            "$ARCHS" "$FLUTTER_VERSION" "$(dart --version 2>&1)" \
            > ../release-assets/metadata-macos.txt

      - name: Build and archive Linux app
        if: runner.os == 'Linux'
        working-directory: flutter
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          flutter build linux --release --no-pub \
            --build-name="$RELEASE_VERSION" \
            --build-number="$GITHUB_RUN_NUMBER"
          BUNDLE="build/linux/x64/release/bundle"
          test -x "$BUNDLE/relgeo"
          test -d "$BUNDLE/data"
          test -d "$BUNDLE/lib"
          mkdir -p ../release-assets ../release-package/RelGeo
          cp -R "$BUNDLE"/. ../release-package/RelGeo/
          tar -C ../release-package -czf \
            "../release-assets/RelGeo-linux-x64-v${RELEASE_VERSION}.tar.gz" RelGeo
          printf 'target=linux\narchitecture=x64\nflutter=%s\ndart=%s\n' \
            "$FLUTTER_VERSION" "$(dart --version 2>&1)" \
            > ../release-assets/metadata-linux.txt

      - name: Build and archive Windows app
        if: runner.os == 'Windows'
        working-directory: flutter
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: pwsh
        run: |
          flutter build windows --release --no-pub `
            --build-name=$env:RELEASE_VERSION `
            --build-number=$env:GITHUB_RUN_NUMBER
          $bundle = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$bundle/relgeo.exe")) { throw 'Missing relgeo.exe' }
          if (!(Test-Path "$bundle/flutter_windows.dll")) { throw 'Missing flutter_windows.dll' }
          if (!(Test-Path "$bundle/data")) { throw 'Missing data directory' }
          New-Item -ItemType Directory -Force ../release-assets | Out-Null
          Compress-Archive -Path "$bundle/*" -DestinationPath "../release-assets/RelGeo-windows-x64-v$env:RELEASE_VERSION.zip" -CompressionLevel Optimal
          @(
            'target=windows'
            'architecture=x64'
            "flutter=$env:FLUTTER_VERSION"
            "dart=$(dart --version 2>&1)"
          ) | Set-Content ../release-assets/metadata-windows.txt

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Create draft GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums and release manifest
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          MCP_REVISION: ${{ env.MCP_REVISION }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          cd release-assets
          shopt -s nullglob
          archives=(*.zip *.tar.gz)
          test "${#archives[@]}" -eq 3
          sha256sum "${archives[@]}" > SHA256SUMS.txt
          python3 - <<'PY'
          import glob
          import json
          import os
          from pathlib import Path

          metadata = {}
          for filename in sorted(glob.glob('metadata-*.txt')):
              fields = {}
              for line in Path(filename).read_text().splitlines():
                  key, value = line.split('=', 1)
                  fields[key] = value
              metadata[fields['target']] = fields

          manifest = {
              'applicationVersion': os.environ['RELEASE_VERSION'],
              'flutterRevision': os.environ['GITHUB_SHA'],
              'mcpRevision': os.environ['MCP_REVISION'],
              'flutterVersion': os.environ['FLUTTER_VERSION'],
              'prerelease': os.environ['PRERELEASE'] == 'true',
              'artifacts': sorted(glob.glob('*.zip') + glob.glob('*.tar.gz')),
              'platformBuilds': metadata,
          }
          Path('release-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Create draft release for maintainer review
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RelGeo Desktop v${{ needs.validate.outputs.version }}
          draft: true
          prerelease: ${{ needs.validate.outputs.prerelease }}
          generate_release_notes: true
          body: |
            This draft contains native desktop builds for macOS, Ubuntu/Linux x64, and Windows x64.

            **Install:** download and extract the archive for your OS. On Windows, run `relgeo.exe` from the extracted folder. On Linux, run `./relgeo` from the extracted `RelGeo/` folder. On macOS, move `RelGeo.app` to Applications if desired.

            These initial archives are unsigned. macOS notarization and Windows code signing are not included. Linux requires GTK 3 and the system libraries used by Flutter desktop apps. Review and smoke-test each target before publishing this release.

            SHA-256 checksums and build provenance are attached.
          files: release-assets/*
          fail_on_unmatched_files: true
